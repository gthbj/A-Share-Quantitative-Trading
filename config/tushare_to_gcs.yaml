project_id: "data-aquarium"
location: "asia-east2"

auth:
  # 本地如果还没有 ADC，可临时设环境变量 ASHARE_USE_GCLOUD_ACCESS_TOKEN=1。
  # Cloud Run Job 里建议使用默认服务账号，保持 false。
  use_gcloud_access_token: false
  gcloud_token_timeout_seconds: 30

gcs:
  bucket: "data-aquarium"
  prefix: "a-share/tushare"

outputs:
  raw:
    # 必留：append-only 原始接口快照，保留原始字段和 ingested_at/run_id 审计信息。
    enabled: true
  standardized:
    # Tushare 已经是结构化表；标准层先不物理双写，等接 BigQuery DWD/DWS 时再开启或回放 raw 生成。
    enabled: false

checkpoint:
  enabled: true
  prefix: "_checkpoints"
  # 默认只跳过已成功上传的数据；empty 不跳过，避免当天数据未入库时被永久记空。
  skip_statuses: ["uploaded"]

run_behavior:
  # 单个任务失败后继续跑后续任务；整批结束后如果存在 failed 记录，CLI 仍返回失败状态。
  fail_run_on_job_error: true

tushare:
  token_env: "TUSHARE_TOKEN"
  # 代理或私有 Tushare HTTP 入口。不要把 token 写进配置；token 只走环境变量或 Secret Manager。
  http_url_env: "TUSHARE_HTTP_URL"
  http_url: "http://121.40.135.59:8010/"
  request_timeout_seconds: 30
  calendar_exchange: "SSE"
  # 当前账号接口上限为 120 次/分钟；代码兜底值也按 120 执行。
  max_calls_per_minute: 120
  retry:
    attempts: 3
    initial_sleep_seconds: 5
    backoff_multiplier: 2

defaults:
  start_date: "20190101"
  end_date: null

# 调度优先级是配置标签，不是 Python 代码里的固定枚举。
# 以后可追加 p3、minute、news、macro 等标签，再给 endpoint 标注对应 priority。
priority_order:
  - "p0"
  - "p1"
  - "p2"

endpoints:
  trade_cal:
    priority: "p0"
    phase: 1
    api_name: "trade_cal"
    target_table: "dim_trade_calendar"
    mode: "date_range"
    partition: "all"
    row_limit: 6000
    params:
      exchange: "SSE"

  daily:
    priority: "p0"
    phase: 1
    api_name: "daily"
    target_table: "fact_equity_kline_1d"
    mode: "by_trade_date"
    date_param: "trade_date"
    row_limit: 6000
    params: {}

  adj_factor:
    priority: "p0"
    phase: 1
    api_name: "adj_factor"
    target_table: "fact_adjust_factor"
    mode: "by_trade_date"
    date_param: "trade_date"
    row_limit: 6000
    params: {}

  dividend:
    priority: "p0"
    phase: 1
    api_name: "dividend"
    target_table: "fact_dividend"
    mode: "by_trade_date"
    date_param: "ex_date"
    row_limit: 5000
    params: {}

  stock_basic_listed:
    priority: "p1"
    phase: 1
    api_name: "stock_basic"
    target_table: "dim_security"
    mode: "snapshot"
    partition: "all"
    row_limit: 6000
