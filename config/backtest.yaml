# A股模拟量化交易系统 - 回测配置

# 回测基础参数
backtest:
  start_date: "20200101"
  end_date: "20231231"
  initial_capital: 1000000  # 初始资金：100万人民币
  benchmark: "000300.SH"   # 沪深300
  frequency: "15min"       # 回测频率：daily / 1min / 5min / 15min / 30min / 60min

# 交易费率
trading:
  commission_rate: 0.00025   # 券商佣金：万分之2.5
  min_commission: 5.0       # 最低佣金5元
  stamp_duty_rate: 0.0005   # 印花税：千分之0.5（卖出时收取）
  transfer_fee_rate: 0.00001 # 过户费：万分之0.1（沪市双向）

# 滑点设置
slippage:
  enabled: true
  type: "percent"  # percent | fixed
  value: 0.003     # 0.3%（调高以更保守估计实盘摩擦）

# 撮合规则
execution:
  price_type: "next_open"  # next_open | current_close
  volume_limit: 0.10       # 单笔订单不超过当日成交量的10%
  allow_short: false       # 不允许做空

# 数据配置
data:
  source: "maxcompute"      # 当前固定使用 MaxCompute；akshare/tushare 实现暂保留但不启用
  cache_dir: "data/raw"
  storage_format: "parquet"  # parquet | csv

  # 本地缓存策略：MaxCompute SQL 查询计费，首次拉取后落盘，后续命中本地缓存
  cache:
    retention_days: 7        # 缓存文件保留时长（天），超过此期限的文件会被清理
    max_size_gb: 1.0         # 缓存目录最大体积（GB），超过则按修改时间升序清理至阈值内

  # 阿里云 MaxCompute（ODPS）数据源配置
  # 敏感凭据（access_id / access_key）放在 config/secrets.yaml，不入 git
  maxcompute:
    endpoint: "http://service.cn-beijing.maxcompute.aliyun.com/api"
    project: "a_share_historical_data"
    # 表名映射
    # 项目 a_share_historical_data 目前仅 cn_stock_kline_5min 一张表已建立，其余周期/
    # 元信息/指数成分股表待后续 PRD 建立。未配置（空字符串）的项在被调用时会抛出
    # NotImplementedError，错误信息会明确指出对应 key。
    tables:
      # —— 已建表（已接入）——
      kline_5min: "cn_stock_kline_5min"
      # —— 复权因子表（接口已预留，待复权 PRD 接入）——
      adjust_factor: ""
      # —— 以下表尚未建立，对应 period 调用会抛 NotImplementedError ——
      daily: ""                # 日K表
      kline_1min: ""           # 1 分钟K表
      kline_etf_15min: "cn_etf_kline_15min"  # ETF 15min K 表（代码格式为框架格式 XXXXXX.SH）
      kline_15min: ""          # 15 分钟K表（普通股票，待建）
      kline_30min: ""          # 30 分钟K表
      kline_60min: ""          # 60 分钟K表
      stock_info: ""           # 股票基础信息表（若空，get_stock_list 会从 5min 表派生）
      index_constituent: ""    # 指数成分股表（若空，get_index_constituents 返回空列表）

# 止损配置
stop_loss:
  enabled: true          # 是否启用全局止损
  threshold: 0.05        # 止损阈值：浮亏达到 5% 时触发（正数表示百分比）

# 日志
logging:
  level: "INFO"
  file: "logs/backtest.log"
