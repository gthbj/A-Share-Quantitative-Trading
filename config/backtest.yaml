# A股模拟量化交易系统 - 回测配置

# 回测基础参数
backtest:
  start_date: "20200101"
  end_date: "20231231"
  initial_capital: 1000000  # 初始资金：100万人民币
  benchmark: "000300.SH"   # 沪深300
  frequency: "15min"       # 回测频率：daily / 1min / 5min / 15min / 30min / 60min

# 交易费率
trading:
  commission_rate: 0.00025   # 券商佣金：万分之2.5
  min_commission: 5.0       # 最低佣金5元
  stamp_duty_rate: 0.0005   # 印花税：千分之0.5（卖出时收取）
  transfer_fee_rate: 0.00001 # 过户费：万分之0.1（沪市双向）

# 滑点设置
slippage:
  enabled: true
  type: "percent"  # percent | fixed
  value: 0.003     # 0.3%（调高以更保守估计实盘摩擦）

# 撮合规则
execution:
  price_type: "next_open"  # next_open | current_close
  volume_limit: 0.10       # 单笔订单不超过当日成交量的10%
  allow_short: false       # 不允许做空

# 账户专项交易权限
# false 表示当前账户没有该权限，回测数据源会过滤对应标的。
account:
  trading_permissions:
    allow_bse: false                 # 北交所：通常需 50万资产 + 24个月交易经验
    allow_star_market: false         # 科创板：通常需 50万资产 + 24个月交易经验
    allow_chinext: false             # 创业板：通常需 10万资产 + 24个月交易经验
    allow_hk_stock_connect: false    # 港股通：通常需 50万资产
    allow_neeq: false                # 新三板/全国股转：通常需更高资产门槛，分层不同
    allow_risk_warning: false        # ST/*ST 风险警示股票：需签署风险揭示书
    allow_delisting: false           # 退市整理股票：需风险揭示/确认
    allow_margin_trading: false      # 融资融券：当前策略不启用信用交易
    allow_stock_options: false       # 股票/ETF 期权：当前策略不交易期权
    allow_convertible_bonds: false   # 可转债：当前股票策略不交易可转债
    allow_cdr: false                 # 存托凭证 CDR：后续接入时默认过滤
    allow_unknown_security: false    # dim_security 无法识别的证券默认不允许买入

# 数据配置
data:
  source: "bigquery"         # 当前默认使用 BigQuery；akshare / tushare 保留为备选
  cache_dir: "data/raw"
  storage_format: "parquet"  # parquet | csv

  # 本地缓存策略：BigQuery 查询按量计费，首次拉取后落盘，后续命中本地缓存
  cache:
    retention_days: 7        # 缓存文件保留时长（天），超过此期限的文件会被清理
    max_size_gb: 1.0         # 缓存目录最大体积（GB），超过则按修改时间升序清理至阈值内

  # Google Cloud BigQuery 数据源配置
  # 敏感凭据（GOOGLE_APPLICATION_CREDENTIALS）放在 config/secrets.yaml 或环境变量，不入 git
  bigquery:
    project_id: "data-aquarium"
    dataset: "ashare"
    location: "asia-east2"
    # 表名映射
    tables:
      # —— 日K线（已接入）——
      kline_1d_equity: "dwd_fact_equity_kline_1d"   # A股日K（含 adjust_type: none/qfq/hfq）
      kline_1d_fund: "dwd_fact_fund_kline_1d"       # ETF/LOF 日K
      kline_1d_index: "dwd_fact_index_kline_1d"     # 指数日K
      # —— 复权因子表（接口预留，日K已内置复权，暂不需要单独查询）——
      adjust_factor: "dwd_fact_adjust_factor"
      # —— 股票基础信息（已接入）——
      dim_security: "dwd_dim_security"               # 股票列表、基金列表、指数列表
      # —— 指数/板块成分股（已接入）——
      board_component: "dwd_fact_board_component_1d" # 指数成分股、板块成分股
      # —— DWS 特征层（ML 策略可选读取）——
      dws_equity_daily_features: "dws_equity_daily_features"
      dws_equity_fundamental_features: "dws_equity_fundamental_features"
      dws_equity_event_money_flow_features_1d: "dws_equity_event_money_flow_features_1d"
      ads_signal_ml_stock_picker_bqml_1d: "ads_signal_ml_stock_picker_bqml_1d"
      # —— 以下分钟级表尚未建立，调用时会抛 NotImplementedError ——
      kline_1min_equity: ""       # 1 分钟K表
      kline_5min_equity: ""       # 5 分钟K表
      kline_15min_equity: ""      # 15 分钟K表（普通股票）
      kline_30min_equity: ""      # 30 分钟K表
      kline_60min_equity: ""      # 60 分钟K表

# 止损配置
stop_loss:
  enabled: true          # 是否启用全局止损
  threshold: 0.05        # 止损阈值：浮亏达到 5% 时触发（正数表示百分比）

# 日志
logging:
  level: "INFO"
  file: "logs/backtest.log"

# 回测产物归档
output:
  gcs_archive:
    enabled: true
    project_id: "data-aquarium"
    bucket: "data-aquarium"
    prefix: "a-share/backtest_runs"
    fail_on_error: true
