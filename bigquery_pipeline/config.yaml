project_id: "data-aquarium"
location: "asia-east2"
dataset: "ashare"

auth:
  use_gcloud_access_token: false
  gcloud_token_timeout_seconds: 30

gcs:
  bucket: "data-aquarium"
  prefix: "a-share/standardized_parquet"

table_prefixes:
  ods: "ods_"
  dwd: "dwd_"
  dws: "dws_"
  ads: "ads_"

financial_indicator:
  source_table: "fact_financial_indicator"
  batch_files: 400
  parallel_read_workers: 16
  max_files: null

defaults:
  ads:
    ml_stock_picker_top_n: 50
    pair_candidate_universe:
      - "000001.SZ"
      - "000002.SZ"
      - "000333.SZ"
      - "000568.SZ"
      - "000651.SZ"
      - "000725.SZ"
      - "000858.SZ"
      - "600000.SH"
      - "600036.SH"
      - "600519.SH"
      - "601318.SH"
      - "601398.SH"
