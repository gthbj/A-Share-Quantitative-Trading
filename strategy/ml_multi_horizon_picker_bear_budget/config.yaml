# MLMultiHorizon 实验 preset：bear 只降风险，不清仓。

name: "ml_multi_horizon_picker_bear_budget"
class: "strategy.ml_multi_horizon_picker.MLMultiHorizonStrategy"
description: "多 Horizon ML 走步策略实验组：新手续费 + bear 非零风险预算"

params:
  model_dir: "models/ml_multi_horizon"
  model_registry_path: "gs://data-aquarium/models/walk_forward/registry.json"
  universe_source: "liquidity_top"
  liquidity_top_n: 500
  liquidity_lookback_days: 60
  target_position_count: 5
  regime_target_position_counts:
    bull: 5
    neutral: 4
    bear: 2
    crisis: 0
  regime_position_pcts:
    bull: 0.85
    neutral: 0.60
    bear: 0.30
    crisis: 0.0
  bear_clear_existing: false
  crisis_enabled: false
  breadth_bear_threshold: 0.35
  breadth_recovery_threshold: 0.55
  min_buy_prob: 0.50
  min_prob_floor: 0.30
  sell_threshold: 0.70
  stop_loss_pct_bull: 0.05
  stop_loss_pct_bear: 0.03
  trailing_stop_pct: 0.03
  min_hold_days: 3
  max_hold_days: 20
  dropout_persistence_days: 2
  rank_buffer_multiplier: 2
  position_pct: 0.95
  use_deterministic_fallback: false
  feature_window: 20
  trading_permissions:
    allow_bse: false
    allow_star_market: false
    allow_chinext: false
    allow_hk_stock_connect: false
    allow_neeq: false
    allow_risk_warning: false
    allow_delisting: false
    allow_margin_trading: false
    allow_stock_options: false
    allow_convertible_bonds: false
    allow_cdr: false
    allow_unknown_security: false

backtest:
  start_date: "20200102"
  end_date: "20260430"
  frequency: "daily"
  initial_capital: 100000
  benchmark: "000300.SH"
