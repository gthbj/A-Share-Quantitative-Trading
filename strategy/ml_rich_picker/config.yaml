# MLRichPicker 回测 preset（PRD_20260525_03）
#
# 用法::
#   python run_backtest.py --strategy strategy.ml_rich_picker.MLRichPickerStrategy \
#       --start 20200102 --end 20250430 --capital 1000000

name: "ml_rich_picker"
class: "strategy.ml_rich_picker.MLRichPickerStrategy"
description: "富特征 ML 策略：30 维 buy (17 daily + 8 fundamental + 5 event) + 39 维 sell"

params:
  # 走步模型注册表（训完后路径）
  model_dir: "models/walk_forward_rich"
  model_registry_path: "gs://data-aquarium/models/walk_forward_rich/registry.json"
  # BigQuery（用于策略 before_trading_start 懒加载富特征）
  bq_project: "data-aquarium"
  bq_dataset: "ashare"
  bq_location: "asia-east2"
  adjust_type: "qfq"
  # 严格 rich 模式：预加载失败直接 raise，避免悄无声息退回 v1 17 维路径
  # 让用户拿到看似 v2 实为 v1 的回测结果（误导）。
  # 调试场景需降级时显式设 false。
  require_rich_features: true
  # 未显式传 universe 时，用回测首日前近 60 日成交额 Top 500 初始化股票池
  # （与 walk_forward_config.yaml 保持一致，避免训练/推理 universe 错配）。
  universe_source: "liquidity_top"
  liquidity_top_n: 500
  liquidity_lookback_days: 60
  # Trading permissions
  trading_permissions:
    allow_bse: false
    allow_star_market: false
    allow_chinext: false
    allow_hk_stock_connect: false
    allow_neeq: false
    allow_risk_warning: false
    allow_delisting: false
    allow_margin_trading: false
    allow_stock_options: false
    allow_convertible_bonds: false
    allow_cdr: false
    allow_unknown_security: false
  # 持仓
  target_position_count: 10
  decision_horizon: 5
  min_buy_prob: 0.50
  min_prob_floor: 0.30
  # sell 桥接到父类 prob_sell 用的阈值（>= 此值即认为应卖）
  # 由 sell_remaining_days_threshold + sigmoid sharpness 共同决定
  # （remaining_days <= threshold 时 prob_sell 显著大于 0.5）
  sell_threshold: 0.50
  # Sell 回归模型参数
  sell_remaining_days_threshold: 1.0   # 预测剩余天数 <= 该值则视为应卖
  sell_remaining_days_sharpness: 1.5   # sigmoid 陡峭度（越大越接近硬阈值）
  sell_max_remaining_days: 20.0        # 与 walk_forward_config.sell_lookforward 对齐
  # 风控
  stop_loss_pct_bull: 0.05
  stop_loss_pct_bear: 0.03
  trailing_stop_pct: 0.03
  min_hold_days: 3
  max_hold_days: 20
  dropout_persistence_days: 2
  rank_buffer_multiplier: 2
  position_pct: 0.95
  # 正式 rich 回测必须使用训练好的 rich 模型；模型缺失/维度不匹配时直接失败。
  # 调试管道时才显式改成 true。
  use_deterministic_fallback: false
  feature_window: 20

backtest:
  start_date: "20200102"
  end_date: "20250430"
  frequency: "daily"
  initial_capital: 1000000
  benchmark: "000300.SH"
