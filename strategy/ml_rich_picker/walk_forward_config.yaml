# Walk-Forward Rich 训练配置（PRD_20260525_03）
#
# 用法（本地）::
#   export ASHARE_USE_GCLOUD_ACCESS_TOKEN=1
#   python -m strategy.ml_rich_picker.walk_forward \
#       --config strategy/ml_rich_picker/walk_forward_config.yaml

logging:
  level: "INFO"

walk_forward:
  initial_train_start: "20170101"
  initial_train_end:   "20191231"   # 第一次重训日
  final_retrain_date:  "20250331"   # 最后一次重训日
  retrain_freq: "month_end"
  rolling_window_years: 3
  model_root: "models/walk_forward_rich"     # 与 v1 的 models/walk_forward 完全隔离

trading_permissions:
  allow_bse: false
  allow_star_market: false
  allow_chinext: false
  allow_hk_stock_connect: false
  allow_neeq: false
  allow_risk_warning: false
  allow_delisting: false
  allow_margin_trading: false
  allow_stock_options: false
  allow_convertible_bonds: false
  allow_cdr: false
  allow_unknown_security: false

universe:
  liquidity_top_n: 500
  liquidity_lookback_days: 60
  fixed_codes: []

labels:
  buy_horizons: [1, 5, 10, 20]
  decision_horizon: 5
  buy_top_quantile: 0.30
  buy_bottom_quantile: 0.30
  # sell 回归 label optimal_remaining_days ∈ [0, sell_lookforward]
  # 推理时 strategy 的 sell_max_remaining_days 必须与此对齐
  sell_lookforward: 5
  sell_drawdown_threshold: -0.05
  sell_underperform_quantile: 0.30   # [兼容] 旧 binary sell 标签用，新回归路径不读

lightgbm:
  # objective 这里默认 binary 给 buy 模型用；sell 回归路径在
  # walk_forward._train_lgbm_with_quality 里会**强制覆盖**成 regression_l1
  # （setdefault 不行，必须硬覆盖，否则 sell 会被错按 binary 训练）。
  objective: "binary"
  metric: ["binary_logloss", "auc"]
  num_leaves: 63
  learning_rate: 0.05
  feature_fraction: 0.85
  bagging_fraction: 0.85
  bagging_freq: 5
  min_child_samples: 30
  num_boost_round: 200
  early_stopping_rounds: 25
  random_state: 42
  verbose: -1

data:
  source: "bigquery"
  bigquery:
    project_id: "data-aquarium"
    dataset: "ashare"
    location: "asia-east2"
    table_daily: "dws_equity_daily_features"
    table_kline: "dwd_fact_equity_kline_1d"
    table_dim: "dwd_dim_security"
  adjust_type: "qfq"

validation:
  valid_days: 60
  min_buy_auc: 0.52
  # 新 sell 回归模型用 Spearman rank IC 做质量闸门；>= 0.05 视为有效信号
  min_sell_rank_ic: 0.05
  # 旧 binary sell 阈值（保留以便向后兼容；当前未使用）
  min_sell_auc: 0.52
