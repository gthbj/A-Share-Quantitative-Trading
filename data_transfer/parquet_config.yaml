source_root: "D:/A Share"
work_dir: "D:/A_Share_Transfer_Work"
parquet_root: "D:/A_Share_Transfer_Work/parquet"
manifest_path: "D:/A_Share_Transfer_Work/parquet_manifest.jsonl"

ignore_dirs:
  - "D:/A Share/基金_分钟数据"
  - "D:/A Share/A股分钟数据"

gcs:
  project_id: "data-aquarium"
  bucket: "data-aquarium"
  prefix: "a-share/standardized_parquet"
  location: "asia-east2"

upload:
  skip_if_remote_size_matches: true
  verify_after_upload: true
  keep_local_files: true
  audit_sample_files: 30

build:
  chunksize: 10000
  flush_rows: 1000
  max_workers: 1
  table_parallel_workers:
    fact_financial_indicator: 6
  table_chunksize:
    fact_financial_indicator: 20000
  table_flush_rows:
    fact_financial_indicator: 5000
  table_progress_interval:
    fact_financial_indicator: 100
